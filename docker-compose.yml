version: '3.8'

services:
  liga-premium:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liga-premium
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Firebase Configuration (obrigatório)
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      # Google Sheets Configuration (opcional)
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      # Next.js Configuration
      - NODE_ENV=production
    networks:
      - liga-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  localtunnel:
    image: node:20-alpine
    container_name: liga-premium-tunnel
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "npm install -g localtunnel@latest &&
          apk add --no-cache curl &&
          echo 'LocalTunnel instalado. Testando conexão...' &&
          sleep 20 &&
          for i in 1 2 3 4 5 6; do
            if curl -f http://liga-premium:3000/api/health > /dev/null 2>&1; then
              echo 'Conexão OK! liga-premium está acessível.' &&
              break
            fi
            echo 'Tentativa '$$i': Aguardando liga-premium...' &&
            sleep 5
          done &&
          echo 'Iniciando LocalTunnel na porta 3000...' &&
          if [ -n \"$$LOCALTUNNEL_SUBDOMAIN\" ]; then
            echo 'Tentando criar tunnel com subdomínio: '$$LOCALTUNNEL_SUBDOMAIN &&
            exec lt --port 3000 --host liga-premium --subdomain $$LOCALTUNNEL_SUBDOMAIN
          else
            echo 'Criando tunnel com URL aleatório...' &&
            exec lt --port 3000 --host liga-premium
          fi"
    depends_on:
      liga-premium:
        condition: service_healthy
    networks:
      - liga-network
    environment:
      - LOCALTUNNEL_SUBDOMAIN=${LOCALTUNNEL_SUBDOMAIN:-}

networks:
  liga-network:
    driver: bridge

