version: '3.8'

services:
  liga-premium:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Firebase Configuration (obrigatório - necessário no build time)
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: liga-premium
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Firebase Configuration (obrigatório)
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      # Google Sheets Configuration (opcional)
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      # Next.js Configuration
      - NODE_ENV=production
    networks:
      - liga-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  localtunnel:
    image: node:20-alpine
    container_name: liga-premium-tunnel
    restart: unless-stopped
    network_mode: "service:liga-premium"
    entrypoint: /bin/sh
    command: >
      -c "npm install -g localtunnel@latest &&
          apk add --no-cache curl &&
          echo 'LocalTunnel instalado. Aguardando aplicação estar pronta...' &&
          sleep 30 &&
          echo 'Testando aplicação em localhost:3000...' &&
          until curl -f http://localhost:3000/api/health > /dev/null 2>&1; do
            echo 'Aguardando aplicação iniciar...' &&
            sleep 5
          done &&
          echo 'Aplicação está pronta! Iniciando LocalTunnel...' &&
          if [ -n \"$$LOCALTUNNEL_SUBDOMAIN\" ]; then
            echo 'Tentando criar tunnel com subdomínio: '$$LOCALTUNNEL_SUBDOMAIN &&
            timeout 15 lt --port 3000 --subdomain $$LOCALTUNNEL_SUBDOMAIN || 
            (echo 'Subdomínio não disponível, usando URL aleatório...' && lt --port 3000)
          else
            echo 'Criando tunnel com URL aleatório...' &&
            lt --port 3000
          fi"
    depends_on:
      liga-premium:
        condition: service_healthy
    environment:
      - LOCALTUNNEL_SUBDOMAIN=${LOCALTUNNEL_SUBDOMAIN:-}

networks:
  liga-network:
    driver: bridge

